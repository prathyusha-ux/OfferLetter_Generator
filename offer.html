<html>
  <head>
    <title>Offer Letter Generator — UX Interfacely IT Solutions</title>
    <link rel="stylesheet" href="offer letter.css"> 
  </head>
  <body>
    <h1>Offer Letter Generator</h1>
    <form>
      <fieldset>
        <legend>Employee Details</legend>
        <label>Full Name</label>
        <input type="text" id="empName" placeholder="Full Name" required>
        <label>Date of Joining</label>
        <input type="date" id="doj" required>
        <label>Offer Letter Date</label>
        <input type="date" id="letterDate" required>
      </fieldset>

      <fieldset>
        <legend>Role</legend>
        <label for="jobTitle">Job Title</label>
        <input list="roles" id="jobTitle" name="roles-choice" placeholder="Type or select...">
        <datalist id="roles">
          <option value="HR">
          <option value="QA Engineer">
          <option value="Software Engineer">
          <option value="Front End Developer">
          <option value="UI/UX Designer">
          <option value="Business Analyst">
          <option value="Full stack Developer">
        </datalist>

        <label>Department</label>
        <input id="department">

        <label>Work Location</label>
        <select id="workLocation">
          <option value="" disabled selected hidden>Select</option>
          <option value="Hyderabad Corporate Office - WFH">Hyderabad Corporate Office - WFH</option>
          <option value="Hyderabad Corporate Office - WFO">Hyderabad Corporate Office - WFO</option>
          <option value="Hyderabad Corporate Office - Hybrid">Hyderabad Corporate Office - Hybrid</option>
          <option value="__custom">Custom…</option>
        </select>

        <div id="customLocationField">
          <label for="customLocation">Custom Location</label>
          <input type="text" id="customLocation">
        </div>

        <label>Role Description</label>
        <textarea id="roleDesc" rows="3"> </textarea>
      </fieldset>

      <fieldset>
        <legend>Compensation</legend>
        <label>Annual CTC (₹)</label>
        <input type="number" id="annualCtc" value="300000" min="0" step="1000">
        <label>Variable Pay - Annual (₹)</label>
        <input type="number" id="variablePay" value="30000" min="0" step="1000">
        <label>Employee PF Rate (%)</label>
        <input type="number" id="pfPct" value="12" min="0" max="100" step="0.1">
        <label>Statutory PF Cap - Monthly (₹)</label>
        <input type="number" id="pfCap" value="1800" min="0" step="10">
        <label>Professional Tax - Monthly (₹)</label>
        <input type="number" id="ptMonthly" value="200" min="0" step="10">
      </fieldset>

      <fieldset>
        <legend>Terms</legend>
        <label>Notice Period (days)</label>
        <input type="number" id="noticePeriod" value="90" min="0" step="5">

        <div class="toggle-row">
          <input type="checkbox" id="bondToggle" checked>
          <label for="bondToggle">Include service bond clause</label>
        </div>
        <div id="bondFields" class="show">
          <label>Bond Duration (years)</label>
          <input type="number" id="bondYears" value="1" min="0" step="0.5">
          <label>Reimbursement Amount (₹)</label>
          <input type="number" id="bondAmount" value="200000" min="0" step="10000">
        </div>
      </fieldset>

      <button type="button" id="generateBtn">Generate Offer letter</button>
      <button type="button" id="printBtn">Download as PDF</button>
    </form>

    <!-- Libraries used to turn the letter into a real PDF file and download it -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <p id="previewStatus">Not generated</p>
    <div id="letterEmpty">Fill in the employee details above and click <strong>Generate Offer letter</strong> to preview it here.</div>
    <div id="letterOutput"></div>

<script src="script.js">
</script>
</body>
</html>
